name: Open Food Facts — Denní import

on:
  # Automatický denní spouštěč ve 3:00 UTC (4:00 nebo 5:00 ČAS)
  schedule:
    - cron: "0 3 * * *"

  # Manuální spuštění z GitHub UI (Actions → Run workflow)
  # Zde lze také spustit plný import přepnutím full_import na true
  workflow_dispatch:
    inputs:
      full_import:
        description: "Spustit plný import celé databáze? (jen při inicializaci)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      region:
        description: "Filtr zemí (core=střední EU, eu=celá EU, all=svět)"
        required: false
        default: "core"
        type: choice
        options:
          - "core"
          - "eu"
          - "all"

jobs:
  import:
    name: Import Open Food Facts dat
    runs-on: ubuntu-latest

    # GitHub Actions free tier: 2 000 minut/měsíc pro private repo
    # Delta import ~5 min/den = 150 min/měsíc → well within limits
    # Plný import ~90 min → jednorázové

    steps:
      # checkout@v5 a setup-python@v6 běží nativně na Node.js 24
      - name: Checkout
        uses: actions/checkout@v5

      # ── 2. Python setup ───────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      # ── 3. Instalace závislostí ───────────────────────────────────
      - name: Instalace závislostí
        run: pip install -r scripts/requirements.txt

      # ── 4. Delta import (denní) ───────────────────────────────────
      - name: Delta import
        if: github.event_name == 'schedule' || inputs.full_import == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Denní cron vždy používá výchozí region (core)
        # Pro změnu výchozího regionu uprav DEFAULT_REGION v import_off.py
        run: python scripts/import_off.py
        timeout-minutes: 30

      # ── 5. Plný import (manuální, jen při inicializaci) ───────────
      - name: Plný import (inicializace)
        if: inputs.full_import == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          REGION="${{ inputs.region || 'core' }}"
          echo "Spouštím plný import — region=${REGION}, očekávej 45–90 minut"
          python scripts/import_off.py --full --region="${REGION}"
        timeout-minutes: 120

      # ── 6. Notifikace při selhání ─────────────────────────────────
      - name: Notifikace při selhání
        if: failure()
        run: echo "Import selhal — zkontroluj logy výše a tabulku import_log v Supabase."